---
name: Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install validation tools
        run: >-
          dnf install -y git make python3 curl openssl shellcheck systemd podman
          rpm-ostree policycoreutils tar findutils diffutils
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Butane 0.29.0
        run: |
          curl --fail --location --output /usr/local/bin/butane \
            https://github.com/coreos/butane/releases/download/v0.29.0/butane-x86_64-unknown-linux-gnu
          printf '%s  %s\n' \
            53a20d820fbaa7fda4f1afd1814974badc8e448db4c151d3f1ba005dc29bc4c9 /usr/local/bin/butane \
            | sha256sum --check
          chmod 755 /usr/local/bin/butane
      - name: Validate real provisioning inputs and backup behavior
        run: make lint
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Security scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: yaml,secrets
          quiet: true
          soft_fail: false
